<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login </title>
    <link rel="stylesheet" href="/CSS/Login form/Style.CSS">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <form action="" class="form-login">
        <img class="logo" src="image/Logo.png" alt="Logo Sea">
        <h1 class="title-form">Login</h1>
        <p class="sub-title" >Welcome back please login to your account</p>

        <label for="" class="label-input">Email:</label>
        <input class="form-input" type="email" name="email"  placeholder="Enter email"><i class="fa-solid fa-envelope"></i><br><br>

        <label for="" class="label-input">Username:</label>
        <input class="form-input" type="text" name="username" placeholder="Username"><br><br>

         <label for="" class="label-input">Password:</label>
         <input class="form-input" type="password" name="password" placeholder="Password"><br><br>
        
         <label for="" class="label-input">Confirm password:</label>
         <input class="form-input" type="password" name="password" placeholder="Confirm password"><br><br>

         <input class="form-checkbox" type="checkbox" name="terms">
         <label class="label-input">Remember Me</label><br><br>

         <button class="sign-btn">Sign up</button><br><br><br><br>

         <label for="" class="label-input">Already have an account? <a href="" class="sign-in">Sign in</a></label>
    </form>
</body>
</html>
