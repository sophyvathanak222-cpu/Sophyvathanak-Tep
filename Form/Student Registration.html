<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width: 450px; margin: auto; border: 3px solid rgb(18, 15, 14); padding: 15px; border-radius: 10px; border-bottom: 10px solid ; border-top: 10px solid;">
        <h1 style="color: red;"><i><u>Student Registration</u></i></h1>
        <label for="">Full Name:</label>
        <input type="text" name="name"><br><br>

        <label for="">Email Address:</label>
        <input type="email" name="email"><br><br>

        <label for="">Password:</label>
        <input type="password" name="Password"><br><br>

        <label for="">Date of Birth:</label>
        <input type="date" name="date"><br><br>

        <label for="">Skills You Have:</label><br>
        <input type="checkbox" name="HTML" id="">
        <label>HTML</label><br>

        <input type="checkbox" name="CSS" id="">
        <label>CSS</label><br>

        <input type="checkbox" name="JAVASCRIPT" id="">
        <label>JAVASCRIPT</label><br><br>

        <label>Additional Comments:</label><br>
        <textarea name="Comments" rows="4px" cols="40px" style="border-radius: 3px;" placeholder="Enter your comments"></textarea><br><br>
        
        <label for="">Upload your file:</label><br><br>
        <button type="submit">Choose File</button>
        <label>No file chosen</label><br><br>

        <button type="submit">Upload</button><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
