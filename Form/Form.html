<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exrcises1 Form Html</title>
</head>
<body>
    <form action="" style="width: 300px; margin: auto; background-color: darkcyan; border-radius: 10px;border-color: black; padding: 15px; border: 2px solid black; border-bottom: 10px solid black; border-top: 10px solid black;">
        <h1 align="center" style="color: darkred; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);" ><u><i>Student Registration Form</i></u></h1> 
        <label for="">Full Name:</label><br>
        <input type="text" name="Full Name" placeholder="Enter your Full Name"><br><br>

        <label for="">Username:</label><br>
        <input type="text" name="Username" placeholder="Enter Username"><br><br>

        <label for="">Password:</label><br>
        <input type="password" name="Password" placeholder="Enter Password"><br><br>

          <label for="">Confirm Password:</label><br>
        <input type="password"  placeholder="Confirm Password"><br><br>

        <label for="">Email:</label><br>
        <input type="email" name="email" placeholder="Enter Email"><br><br>

        <label for="">Age:</label><br>
        <input type="number" name="age" placeholder="Enter Age"><br><br>

        <label for="">Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter Phone Number"><br><br>

        <button type="submit" style="border-radius: 5px; color: rgb(251, 252, 252); background-color: blue;">Register</button>
        <button type="reset" style="border-radius: 5px; color: rgb(251, 252, 252); background-color: red;">Reset</button>
    </form>
</body>
</html>
