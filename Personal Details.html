<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width: 400px; margin: auto;">
        <h1 align="center" style="color: gray;"><u><i>Form Information</i></u></h1>
        <fieldset style="border: 5px solid grey; border-radius: 10px; ">
              <legend>Personal Details</legend><br>
              <label for="">Salutation:</label><br>

              <select name="None">
              <option value="">--None--</option>
              </select><br><br>

             <label for="">First Name:</label>
             <input type="name" placeholder="First name"><br><br>

             <label for="">Last Name:</label>
             <input type="name" placeholder="Last name"><br><br>

             <label for="">Gender:</label>
             <input type="radio" name="Male">
             <label>Male</label>

             <input type="radio" name="Female">
             <label>Female</label><br><br>

             <label>Email:</label>
             <input type="email" name="email" placeholder="Enter your email"><br><br>

             <label>Date of Birth: </label>
             <input type="date" name="dob"><br><br>

             <label for="">Address:</label><br>
             <textarea name="address" rows="4" cols="40" style="border: 2px grey solid;"></textarea>
        </fieldset>
      
    </form>
</body>
</html>
