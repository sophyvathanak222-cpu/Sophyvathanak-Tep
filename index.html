<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Form Html</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <form action="" style="width: 500px; margin: auto; border: 2px solid gray; padding: 20px; border-radius: 10px; ;">
        <h1 style="text-shadow: 1px 1px red; 2px 2px blue;"><u><i>Register</i></u></h1>
        <label for="">First Name:</label><br>
        <input type="text" name="firstName" placeholder="First name"><br><br>

        <label for="">Last Name:</label><br>
        <input type="text" name="Last Name " placeholder="Last Name"><br><br>

        <label for="e">Enter Email:</label><br>
        <input type="email" name="email"  placeholder="Enter Email"><br><br>

        <label for="">Enter Password:</label><br>
        <input type="password" name="password" placeholder="Enter Password"><br><br>

        <label for="">Confirm Password:</label><br>
        <input type="password"  placeholder="Confirm Password"><br><br>

        <label for="">Phone Number:</label><br>
        <input type="text" name="phone" placeholder="Phone Number"><br><br>
        
        <input type="checkbox" name="terms" id="terms">
        <label for="terms">Do you want to remember me?</label><br><br>
        
        <button type="submit" style="background-color: red;">Register</button>
        <button type="reset" style="background-color: gray;">Clear</button>
    </form>
</body>
</html>
