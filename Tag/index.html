<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Html </title>
</head>
<body>
    <h1>Text tag for header</h1>
    <p>Text tag for paragraph</p><br>
    <i>Text tag for italic text</i><br>
    <em>Text tag for emphasis</em><br>
    <b>Text tag for note text</b><br>
    <strong>Text tag for note text</strong><br>
    <mark>Text tag for highlight note</mark><br>
    <u>Text tag for underline</u><br>
    <pre>Text tag for preformatted</pre><br>
    <q>What is the capital of France?</q><br>
    <p>x<sup>2</sup></p><br>
    <p>H<sub>2</sub>o</p><br>
    <del>Deleted text</del>
</body>
</html>
