<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="p-4">
    <div class="container">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle text-center">
                <thead>
                    <tr>
                        <th colspan="10" class="text-start text-white fs-5 fst-italic" style="background-color: teal;">
                            Control Product
                        </th>
                    </tr>
                    <tr class="table-success">
                        <th>ID</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Color</th>
                        <th>Stock</th>
                        <th colspan="2">Active</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>01</td>
                        <td>
                            <img src="https://i.pinimg.com/736x/7b/18/7f/7b187fcd36658dbd9df1fc707e1773de.jpg"
                                 alt="iPhone 17" width="40" class="rounded">
                        </td>
                        <td><b><i>iPhone 17</i></b></td>
                        <td>Apple</td>
                        <td>Smartphone</td>
                        <td>1000$</td>
                        <td>Green</td>
                        <td><span class="badge text-bg-warning">Low Stock</span></td>
                        <td>
                            <button class="btn btn-success btn-sm">
                                <i class="bi bi-cart-plus"></i> Buy
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm">
                                <i class="bi bi-cash-coin"></i> Sell
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
