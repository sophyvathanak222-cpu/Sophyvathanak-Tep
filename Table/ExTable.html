<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercises​​ Table Html</title>
</head>
<body>
    <table border="1"  width="700px" cellspacing="0" cellpadding="10px" align="center">
        <tr>
            <th colspan="5">Table</th>
        </tr>
        <tr>
            <th rowspan="2">A</th>
            <th colspan="3">B</th>
            <th>C</th>
        </tr>
        <tr>
            <th rowspan="2">D</th>
            <th>E</th>
            <th colspan="2">F</th>
        </tr>
        <tr>
            <th>G</th>
            <th rowspan="2">H</th>
            <th colspan="2">I</th>
         <tr>
            <th colspan="2">J</th>
            <th colspan="2">K</th>
         </tr>
         <tr>
            <th rowspan="3">L</th>
            <th colspan="2">M</th>
            <th colspan="2" rowspan="2">N</th>
         </tr>
         <tr>
            <th colspan="2" rowspan="2">O</th>
         </tr>
         <tr>
            <th colspan="2">P</th>
         </tr>
         <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
         </tr>
    </table>
</body>
</html>
