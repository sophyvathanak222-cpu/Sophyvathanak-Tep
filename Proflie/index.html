<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- navbar -->
    <div class="navbar">
        <!-- left -->
        <div class="nav-left">
            <i class="logo bi bi-facebook"></i>
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input class="search" type="text" placeholder="Search facebook">
            </div>
        </div>

        <!-- center -->
        <div class="nav-center">
            <ul class="list-btn-center">
                <li><button class="btn-center"><i class="bi bi-house"></i></button></li>
                <li><button class="btn-center"><i class="bi bi-person-video2"></i></button></li>
                <li><button class="btn-center"><i class="bi bi-shop"></i></button></li>
                <li><button class="btn-center"><i class="bi bi-people"></i></button></li>
                <li><button class="btn-center"><i class="bi bi-controller"></i></button></li>
            </ul>
        </div>

        <!-- right -->
        <div class="nav-right">
            <ul class="list-right">
                <li><button class="btn-nav-right"><i class="bi bi-list"></i></button></li>
                <li><button class="btn-nav-right"><i class="bi bi-messenger"></i></button></li>
                <li><button class="btn-nav-right"><i class="bi bi-bell-fill"></i></button></li>
                <li><img class="img-logo-profile" src="images/image.png" alt="Me"></li>
            </ul>
        </div>
    </div>

    <!-- main profile -->
    <div class="main-profile">

        <!-- cover -->
        <div class="img-cover">
            <img src="images/image copy.png" alt="cover">
        </div>

        <!-- profile detail -->
        <div class="profile-header">
            <div class="avatar-wrap">
                <div class="share"><span>Share a thought...</span></div>
                <div class="img-profile">
                    <img src="images/image.png" alt="Profile picture">
                </div>
            </div>

            <div class="profile-info">
                <h1 class="profile-name">Vatha nak</h1>
                <p class="profile-follower">1.4K followers • 1.1K following</p>
                <p class="profile-creator"><i class="bi bi-briefcase-fill"></i> Digital creator</p>
            </div>

            <div class="profile-actions">
                <button class="btn-primary"><i class="bi bi-plus-lg"></i> Add to story</button>
                <button class="btn-secondary"><i class="bi bi-pencil-fill"></i> Edit profile</button>
            </div>
        </div>

        <!-- profile detail list (tabs) -->
        <ul class="profile-tabs">
            <li class="tab active">Posts</li>
            <li class="tab">About</li>
            <li class="tab">Friends</li>
            <li class="tab">Photos</li>
            <li class="tab">Videos</li>
            <li class="tab tab-more"> 
                <select class="btn-more" >
                    <option>More</option>
                    <option>Groups</option>
                    <option>Events</option>
                    <option>Check-ins</option>
                    <option>Reviews given</option>
                    <option>Manage sections</option>
                </select>
            </li>
        </ul>
        
    </div>

</body>
</html>
